name: desktop-build

# HunterMate 桌面版构建发布 pipeline(huntermate-desktop 私有仓 dispatcher 触发)。
#
# 触发:router 的 desktop-build 事件;params:
#   version     语义化版本(必填,如 0.1.0;dispatcher 从 tag v* 剥前缀)
#   notes       发行说明(可选)
#   mac         "true" 构建 macOS(默认 true;macos-14 10x 计费,按需关)
#   win         "true" 构建 Windows(默认 true)
#
# 产物:七牛 hiredchina-npm-mirror packages/huntermate-desktop-releases/
#   v<version>/HunterMate-<version>-<arch>.dmg           ← 人工安装面
#   v<version>/HunterMate-<version>-mac-<arch>.zip       ← 自动更新载体(Squirrel.Mac)
#   v<version>/HunterMate Setup <version>.exe            ← 人工安装面(win)
#   v<version>/*.blockmap                                ← 差分更新前提
#   latest.yml / latest-mac.yml                          ← electron-updater 清单(根目录)
#   latest.json(下载页 /downloads 消费,带 cache-buster)
#
# 需要工厂仓 Secrets:FACTORY_PAT(检出私有仓)、QINIU_ACCESS_KEY/QINIU_SECRET_KEY。
# 2026-11-05 用户裁定:GitHub Release 腿已砍(自动更新链只吃七牛 generic provider,
# RELEASES_PAT 不再补配),publish-github job 删除;七牛为唯一发布通道。
# FID-121 教训在上传脚本内消化(curl + up 主机 fallback),job 不感知。

on:
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      sha:
        required: true
        type: string
      params_json:
        required: true
        type: string

jobs:
  detect:
    name: resolve params
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      notes: ${{ steps.v.outputs.notes }}
      want_mac: ${{ steps.v.outputs.want_mac }}
      want_win: ${{ steps.v.outputs.want_win }}
    steps:
      - id: v
        env:
          PARAMS: ${{ inputs.params_json }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version // ""' <<< "$PARAMS")
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || { echo "✗ params.version 非法: '$VERSION'"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "notes=$(jq -r '.notes // ""' <<< "$PARAMS" | tr '\n' ' ' | cut -c1-500)" >> "$GITHUB_OUTPUT"
          echo "want_mac=$(jq -r '.mac // "true"' <<< "$PARAMS")" >> "$GITHUB_OUTPUT"
          echo "want_win=$(jq -r '.win // "true"' <<< "$PARAMS")" >> "$GITHUB_OUTPUT"
          echo "✓ desktop-build params: version=$VERSION"

  build-mac:
    name: mac dmg+zip (${{ matrix.arch }})
    needs: detect
    if: ${{ needs.detect.outputs.want_mac == 'true' }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.sha }}
          token: ${{ secrets.FACTORY_PAT }}
          fetch-depth: "1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # electron 二进制走 npmmirror(CN 可达,仓库 .npmrc 亦已配置)
      - name: Prepare deps + assets + gate
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: |
          set -euo pipefail
          npm ci
          npm run prepare:runtime
          npm run prepare:hm-server
          npm run build:gate
      - name: Unit tests (发版门禁)
        run: npm test
      # E2E 只跑 arm64(x64 在 arm64 runner 上无 Rosetta 保证;x64 链由打包门禁+真机 E2E 覆盖)
      - name: E2E tests (真实应用冷启动全链路;仅 mac——win runner GUI 会话不确定)
        if: ${{ matrix.arch == 'arm64' }}
        run: npm run test:e2e
      # dist-mac.mjs:electron-builder zip target(产 .app+zip+app-update.yml)→ 门禁
      # → staging(含 beta 首次运行脚本)→ UDZO dmg。zip=自动更新载体,dmg=人工安装面。
      - name: Build dmg + update zip
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: node scripts/dist-mac.mjs ${{ matrix.arch }}
      - name: x64 产物门禁:原生模块必须带 darwin-x64 prebuild(arm64 runner 交叉打包不重建原生依赖)
        if: ${{ matrix.arch == 'x64' }}
        run: |
          set -euo pipefail
          for mod in resources/hm-server/node_modules/better-sqlite3 resources/runtime/node_modules/sherpa-onnx-darwin-x64; do
            if [ -d "$mod" ]; then
              find "$mod" -name "*darwin-x64*" | grep -q . || { echo "✗ $mod 缺 darwin-x64 prebuild"; exit 1; }
            fi
          done
          echo "✓ x64 prebuild 门禁通过"
      - name: Locate + hash artifact
        id: art
        run: |
          set -euo pipefail
          DMG=$(ls dist/*.dmg | head -1)
          ZIP=$(ls dist/*-mac-${{ matrix.arch }}.zip | head -1)
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha=$(shasum -a 256 "$DMG" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: |
            ${{ steps.art.outputs.dmg }}
            ${{ steps.art.outputs.zip }}
            ${{ steps.art.outputs.zip }}.blockmap
          if-no-files-found: error

  build-win:
    name: win nsis (x64)
    needs: detect
    if: ${{ needs.detect.outputs.want_win == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.sha }}
          token: ${{ secrets.FACTORY_PAT }}
          fetch-depth: "1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare deps + assets + gate
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run prepare:runtime
          npm run prepare:hm-server
          npm run build:gate
      - name: Unit tests (发版门禁)
        shell: bash
        run: npm test
      - name: Build nsis
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        shell: bash
        run: npx electron-builder --win nsis --x64 --publish never
      - name: 打包产物门禁 (electron-builder 会静默丢 extraResources 源顶层 node_modules,v0.1.5 实证)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/assert-packaged-hm-server.mjs dist/win-unpacked/resources
      - name: Locate + hash artifact
        id: art
        shell: bash
        run: |
          set -euo pipefail
          EXE=$(ls dist/*.exe | head -1)
          echo "exe=$EXE" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "$EXE" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: win-exe
          path: |
            ${{ steps.art.outputs.exe }}
            ${{ steps.art.outputs.exe }}.blockmap
          if-no-files-found: error

  publish:
    name: publish → qiniu CDN
    needs: [detect, build-mac, build-win]
    if: ${{ always() && needs.detect.result == 'success' && (needs.build-mac.result == 'success' || needs.build-mac.result == 'skipped') && (needs.build-win.result == 'success' || needs.build-win.result == 'skipped') && (needs.build-mac.result == 'success' || needs.build-win.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hiredchina-com/hc-action-factory
          ref: main
          fetch-depth: "1"
      # 检出私有仓只为 build-update-feed.mjs(纯 node,不 npm ci;blockmap 全由 build job 自带)
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.sha }}
          token: ${{ secrets.FACTORY_PAT }}
          fetch-depth: "1"
          path: app-src
      - uses: actions/download-artifact@v4
        with:
          name: mac-arm64
          path: artifacts/mac-arm64
        if: ${{ needs.build-mac.result == 'success' }}
      - uses: actions/download-artifact@v4
        with:
          name: mac-x64
          path: artifacts/mac-x64
        if: ${{ needs.build-mac.result == 'success' }}
      - uses: actions/download-artifact@v4
        with:
          name: win-exe
          path: artifacts/win
        if: ${{ needs.build-win.result == 'success' }}
      - name: 组装 electron-updater 清单(latest.yml / latest-mac.yml)
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          ARGS=(--version "$VERSION" --out "$GITHUB_WORKSPACE/feed")
          [ -d artifacts/win ] && ARGS+=(--win-file "$(ls artifacts/win/*.exe | head -1)")
          [ -d artifacts/mac-arm64 ] && ARGS+=(--mac-zip "$(ls artifacts/mac-arm64/*-mac-arm64.zip | head -1)" --mac-dmg "$(ls artifacts/mac-arm64/*.dmg | head -1)")
          [ -d artifacts/mac-x64 ] && ARGS+=(--mac-zip "$(ls artifacts/mac-x64/*-mac-x64.zip | head -1)" --mac-dmg "$(ls artifacts/mac-x64/*.dmg | head -1)")
          node app-src/scripts/build-update-feed.mjs "${ARGS[@]}"
          ls -la feed/
      - name: Publish
        env:
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
          VERSION: ${{ needs.detect.outputs.version }}
          NOTES: ${{ needs.detect.outputs.notes }}
        run: |
          set -uo pipefail
          if [ -z "${QINIU_ACCESS_KEY:-}" ] || [ -z "${QINIU_SECRET_KEY:-}" ]; then
            echo "✗ 工厂仓未配置 QINIU keys,拒绝发布(产物已存 artifact 可补发)"; exit 1
          fi
          MAC_FILE=""; MAC_SHA=""
          if [ -d artifacts/mac-arm64 ]; then
            MAC_FILE=$(ls artifacts/mac-arm64/*.dmg | head -1)
            MAC_SHA=$(sha256sum "$MAC_FILE" | awk '{print $1}')
          fi
          MAC_X64_FILE=""; MAC_X64_SHA=""
          if [ -d artifacts/mac-x64 ]; then
            MAC_X64_FILE=$(ls artifacts/mac-x64/*.dmg | head -1)
            MAC_X64_SHA=$(sha256sum "$MAC_X64_FILE" | awk '{print $1}')
          fi
          WIN_FILE=""; WIN_SHA=""
          if [ -d artifacts/win ]; then
            WIN_FILE=$(ls "artifacts/win"/*.exe | head -1)
            WIN_SHA=$(sha256sum "$WIN_FILE" | awk '{print $1}')
          fi
          # 自动更新载体与清单:zip/blockmap → v<version>/;latest*.yml → 根(清单最后于所有二进制)
          EXTRA=(); ROOTS=()
          for d in artifacts/mac-arm64 artifacts/mac-x64 artifacts/win; do
            [ -d "$d" ] || continue
            for f in "$d"/*.zip "$d"/*.blockmap; do
              [ -e "$f" ] && EXTRA+=(--extra-file "$f")
            done
          done
          [ -f feed/latest.yml ] && ROOTS+=(--root-file feed/latest.yml)
          [ -f feed/latest-mac.yml ] && ROOTS+=(--root-file feed/latest-mac.yml)
          ARGS=(--version "$VERSION" --bucket hiredchina-npm-mirror \
            --key-prefix packages/huntermate-desktop-releases --keep 5 \
            --base-url https://npm.hiredchina.com --notes "$NOTES")
          [ -n "$MAC_FILE" ] && ARGS+=(--mac-file "$MAC_FILE" --mac-sha256 "$MAC_SHA")
          [ -n "$MAC_X64_FILE" ] && ARGS+=(--mac-x64-file "$MAC_X64_FILE" --mac-x64-sha256 "$MAC_X64_SHA")
          [ -n "$WIN_FILE" ] && ARGS+=(--win-file "$WIN_FILE" --win-sha256 "$WIN_SHA")
          node scripts/qiniu-desktop-release.mjs "${ARGS[@]}" "${EXTRA[@]}" "${ROOTS[@]}"

  # GitHub Release 腿:2026-11-05 用户裁定砍掉(自动更新链只吃七牛 generic
  # provider;RELEASES_PAT 不再补配)。原 publish-github job 整段删除,
  # finalize 不再引用;七牛 publish 是唯一发布门。

  finalize:
    name: finalize (status)
    needs: [detect, build-mac, build-win, publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Resolve final state
        id: state
        env:
          DETECT: ${{ needs.detect.result }}
          MAC: ${{ needs.build-mac.result }}
          WIN: ${{ needs.build-win.result }}
          PUBLISH: ${{ needs.publish.result }}
        run: |
          ok_or_skip() { [[ "$1" == "success" || "$1" == "skipped" ]]; }
          if [[ "$DETECT" == "failure" || "$PUBLISH" == "failure" ]]; then
            echo "state=failure" >> "$GITHUB_OUTPUT"
          elif [[ "$DETECT" == "success" ]] && ok_or_skip "$MAC" && ok_or_skip "$WIN" && [[ "$PUBLISH" == "success" ]]; then
            echo "state=success" >> "$GITHUB_OUTPUT"
          else
            echo "state=error" >> "$GITHUB_OUTPUT"
          fi
      - name: Report
        env:
          STATE: ${{ steps.state.outputs.state }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          if [ "$STATE" = "success" ]; then
            echo "::notice title=desktop-build::HunterMate Desktop v${VERSION} 已发布 → https://npm.hiredchina.com/packages/huntermate-desktop-releases/latest.json"
          else
            echo "::error title=desktop-build::state=${STATE} version=${VERSION}"
            exit 1
          fi
