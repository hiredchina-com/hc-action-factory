name: desktop-build

# HunterMate 桌面版构建发布 pipeline(huntermate-desktop 私有仓 dispatcher 触发)。
#
# 触发:router 的 desktop-build 事件;params:
#   version     语义化版本(必填,如 0.1.0;dispatcher 从 tag v* 剥前缀)
#   notes       发行说明(可选)
#   mac         "true" 构建 macOS(默认 true;macos-latest(arm64),x64 交叉构建)
#   win         "true" 构建 Windows(默认 true)
#
# 产物:七牛 hiredchina-npm-mirror packages/huntermate-desktop-releases/
#   v<version>/HunterMate-<version>-<arch>.dmg           ← 人工安装面
#   v<version>/HunterMate-<version>-mac-<arch>.zip       ← 自动更新载体(Squirrel.Mac)
#   v<version>/HunterMate Setup <version>.exe            ← 人工安装面(win)
#   v<version>/*.blockmap                                ← 差分更新前提
#   latest.yml / latest-mac.yml                          ← electron-updater 清单(根目录)
#   latest.json(下载页 /downloads 消费,带 cache-buster)
#
# 发布架构(2026-11-09 用户裁定):runner 永不直传七牛(FID-121 上传域 IP 级
# 封禁,v0.3.4 三次实证;runner→jp 隧道 ~40KB/s 亦不可用)。本 workflow 只构建+
# 存工件,handoff 腿 ssh 触发 jp 服务器自治发布(分段拉工件→sha256→七牛→
# CDN 重下校验→下载页读回→企微播报,/opt/hmd-desktop-release/publish-orchestrate.sh)。
# 失败监控:desktop-release-watch.yml(workflow_run 瞬态重试+播报)。
# 需要工厂仓 Secrets:FACTORY_PAT(检出私有仓)、JP_DEPLOY_SSH_KEY/JP_SERVER_HOST_KEY
# (ssh 通道,同 docker-acr-deploy)、WECOM_WEBHOOK_URL(finalize 播报)。

on:
  workflow_call:
    inputs:
      repository:
        required: true
        type: string
      sha:
        required: true
        type: string
      params_json:
        required: true
        type: string

jobs:
  detect:
    name: resolve params
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      notes: ${{ steps.v.outputs.notes }}
      want_mac: ${{ steps.v.outputs.want_mac }}
      want_win: ${{ steps.v.outputs.want_win }}
    steps:
      - id: v
        env:
          PARAMS: ${{ inputs.params_json }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.version // ""' <<< "$PARAMS")
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || { echo "✗ params.version 非法: '$VERSION'"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "notes=$(jq -r '.notes // ""' <<< "$PARAMS" | tr '\n' ' ' | cut -c1-500)" >> "$GITHUB_OUTPUT"
          echo "want_mac=$(jq -r '.mac // "true"' <<< "$PARAMS")" >> "$GITHUB_OUTPUT"
          echo "want_win=$(jq -r '.win // "true"' <<< "$PARAMS")" >> "$GITHUB_OUTPUT"
          echo "✓ desktop-build params: version=$VERSION"

  build-mac:
    name: mac dmg+zip (${{ matrix.arch }})
    needs: detect
    if: ${{ needs.detect.outputs.want_mac == 'true' }}
    # macos-14 镜像已下线(2026-11-07 实证:job 起 1 秒即被平台取消,11-04 还正常;
    # 同仓 macos-latest 探针 11-06 正常)。macos-latest=arm64,x64 走交叉构建。
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.sha }}
          token: ${{ secrets.FACTORY_PAT }}
          fetch-depth: "1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # electron 二进制走 npmmirror(CN 可达,仓库 .npmrc 亦已配置)
      - name: Prepare deps + assets + gate
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          # 交叉打包目标 arch:arm64 runner 产 x64 时,prepare-runtime 按此 arch 解析
          # 平台 optionalDependencies(v0.3.6 实证:缺此标志装成 darwin-arm64,Intel 机 dsh 启动即死)
          HMD_TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          npm ci
          npm run prepare:runtime
          npm run prepare:hm-server
          npm run build:gate
      - name: Unit tests (发版门禁)
        run: npm test
      # E2E 只跑 arm64(x64 在 arm64 runner 上无 Rosetta 保证;x64 链由打包门禁+真机 E2E 覆盖)
      - name: E2E tests (真实应用冷启动全链路;仅 mac——win runner GUI 会话不确定)
        if: ${{ matrix.arch == 'arm64' }}
        run: npm run test:e2e
      # dist-mac.mjs:electron-builder zip target(产 .app+zip+app-update.yml)→ 门禁
      # → staging(含 beta 首次运行脚本)→ UDZO dmg。zip=自动更新载体,dmg=人工安装面。
      - name: Build dmg + update zip
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: node scripts/dist-mac.mjs ${{ matrix.arch }}
      - name: x64 产物门禁:原生模块必须带 darwin-x64 prebuild(arm64 runner 交叉打包不重建原生依赖)
        if: ${{ matrix.arch == 'x64' }}
        run: |
          set -euo pipefail
          # 反向断言(v0.3.6 事故教训):交叉产物严禁混入宿主机(arm64)原生包。
          # 旧门禁用 `[ -d mod ]` 前置判断,目录缺失时静默跳过——arm64 包顶替时恰为缺失,门禁空转。
          if find resources/runtime/node_modules resources/hm-server/node_modules -maxdepth 1 -name '*-darwin-arm64' 2>/dev/null | grep -q .; then
            echo "✗ x64 产物混入 darwin-arm64 原生包(交叉打包按宿主机 arch 装依赖)"
            find resources/runtime/node_modules resources/hm-server/node_modules -maxdepth 1 -name '*-darwin-arm64'
            exit 1
          fi
          # 正向断言:启动链关键原生包必须就位(存在性硬校验,不许跳过)
          for mod in \
            resources/runtime/node_modules/node-addon-require-builtin-darwin-x64 \
            resources/runtime/node_modules/sherpa-onnx-darwin-x64; do
            [ -d "$mod" ] || { echo "✗ 缺 $mod"; exit 1; }
          done
          find resources/hm-server/node_modules/better-sqlite3 -name '*darwin-x64*' | grep -q . \
            || { echo "✗ better-sqlite3 缺 darwin-x64 prebuild"; exit 1; }
          echo "✓ x64 prebuild 门禁通过(无 arm64 残留,关键原生包就位)"
      - name: Locate + hash artifact
        id: art
        run: |
          set -euo pipefail
          DMG=$(ls dist/*.dmg | head -1)
          ZIP=$(ls dist/*-mac-${{ matrix.arch }}.zip | head -1)
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha=$(shasum -a 256 "$DMG" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: |
            ${{ steps.art.outputs.dmg }}
            ${{ steps.art.outputs.zip }}
            ${{ steps.art.outputs.zip }}.blockmap
          if-no-files-found: error
      # Sparkle appcast(2026-11 B 路线):未签名 mac 的静默更新源,客户端按
      # appcast-<arch>.xml 直拉。每版本全量重建(allowDowngrade=false 口径:只升最新)。
      # EdDSA 私钥 secret 缺配硬失败——宁不发版,不放行"永远走降级链"的断链产物。
      - name: 生成 Sparkle appcast(mac 静默更新源)
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          # Sparkle 官方发布版(工具目录,含 generate_appcast/sign_update 通用二进制)。
          # 2026-11-08 起不再依赖 huntermate-desktop 的 electron-sparkle-updater npm 包
          # (其安装器已被客户端弃用,依赖随 b46ce53 清退);URL+sha256 双钉,防供应链漂移。
          SPARKLE_TOOLS_URL: https://github.com/sparkle-project/Sparkle/releases/download/2.9.4/Sparkle-2.9.4.tar.xz
          SPARKLE_TOOLS_SHA256: ce89daf967db1e1893ed3ebd67575ed82d3902563e3191ca92aaec9164fbdef9
        run: |
          set -euo pipefail
          [ -n "$SPARKLE_ED_PRIVATE_KEY" ] || { echo "✗ 工厂仓未配 SPARKLE_ED_PRIVATE_KEY,拒绝发布(mac 更新链断)"; exit 1; }
          ZIP="${{ steps.art.outputs.zip }}"
          ARCH="${{ matrix.arch }}"
          ARCDIR="$GITHUB_WORKSPACE/appcast"
          mkdir -p "$ARCDIR"
          cp "$ZIP" "$ARCDIR/"
          TOOLS="$RUNNER_TEMP/sparkle-tools"
          mkdir -p "$TOOLS"
          curl -fLsS --retry 3 "$SPARKLE_TOOLS_URL" -o "$TOOLS/tools.tar.xz"
          printf '%s  %s\n' "$SPARKLE_TOOLS_SHA256" "$TOOLS/tools.tar.xz" | shasum -a 256 -c -
          tar -xf "$TOOLS/tools.tar.xz" -C "$TOOLS" ./bin/generate_appcast
          BIN="$TOOLS/bin/generate_appcast"
          BASE="https://npm.hiredchina.com/packages/huntermate-desktop-releases"
          echo "$SPARKLE_ED_PRIVATE_KEY" | "$BIN" --ed-key-file - "$ARCDIR" \
            --download-url-prefix "$BASE/v$VERSION/"
          mv "$ARCDIR/appcast.xml" "$ARCDIR/appcast-$ARCH.xml"
          ls -la "$ARCDIR"
      - uses: actions/upload-artifact@v4
        with:
          name: appcast-${{ matrix.arch }}
          path: appcast/appcast-${{ matrix.arch }}.xml
          if-no-files-found: error

  build-win:
    name: win nsis (x64)
    needs: detect
    if: ${{ needs.detect.outputs.want_win == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.sha }}
          token: ${{ secrets.FACTORY_PAT }}
          fetch-depth: "1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare deps + assets + gate
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run prepare:runtime
          npm run prepare:hm-server
          npm run build:gate
      - name: Unit tests (发版门禁)
        shell: bash
        run: npm test
      - name: Build nsis
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        shell: bash
        # 直调 cli.js 弃 npx:v0.3.3/0.3.4 三跑实证该 runner 上 npx 解析 electron-builder
        # 静默退出(零输出 exit 0,诊断跑直调即恢复),不赌 npx 解析链
        run: node node_modules/electron-builder/out/cli/cli.js --win nsis --x64 --publish never
      - name: 打包产物门禁 (electron-builder 会静默丢 extraResources 源顶层 node_modules,v0.1.5 实证)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/assert-packaged-hm-server.mjs dist/win-unpacked/resources
      - name: Locate + hash artifact
        id: art
        shell: bash
        run: |
          set -euo pipefail
          EXE=$(ls dist/*.exe | head -1)
          echo "exe=$EXE" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "$EXE" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: win-exe
          path: |
            ${{ steps.art.outputs.exe }}
            ${{ steps.art.outputs.exe }}.blockmap
          if-no-files-found: error

  # 七牛上传腿已砍(见文件头)。handoff = 本 pipeline 的发布触发门:
  # ssh 通道(cloudflared,同 docker-acr-deploy)调 jp 服务器自治发布编排,
  # 同步等待其完成(0 全绿 / 非 0 失败),60 分钟防 stall 磨死。
  handoff:
    name: handoff → jp 服务器自治发布
    needs: [detect, build-mac, build-win]
    if: ${{ always() && needs.detect.result == 'success' && (needs.build-mac.result == 'success' || needs.build-mac.result == 'skipped') && (needs.build-win.result == 'success' || needs.build-win.result == 'skipped') && (needs.build-mac.result == 'success' || needs.build-win.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: ssh 通道(cloudflared + host key pin,同 docker-acr-deploy 口径)
        run: |
          set -euo pipefail
          sudo curl -sL -o /usr/local/bin/cloudflared \
            "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
          sudo chmod +x /usr/local/bin/cloudflared
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.JP_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.JP_SERVER_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host jp-ssh.hiredchina.com
            User deployer
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
            ServerAliveInterval 30
            ServerAliveCountMax 3
          EOF
          chmod 600 ~/.ssh/config
      # 挂断免疫(2026-11-10 实测定案):cloudflared 隧道会中途断 ssh(单次 4 分钟
      # 即遇 "closed by remote host",60 分钟长会话必死)。编排以 setsid 脱离会话
      # 后台跑,日志+rc 落盘;本步每分钟新连轮询,断连重试到 55 分钟为止。
      - name: 触发 jp 发布编排(脱离会话 + 轮询收成)
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          NOTES: ${{ needs.detect.outputs.notes }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          NOTES_B64=$(printf '%s' "$NOTES" | base64 -w0)
          TS=$(date +%s)
          LOG=/tmp/hmd-publish-$TS.log
          MARK=/tmp/hmd-publish-$TS.rc
          ssh jp-ssh.hiredchina.com \
            "setsid nohup bash -c 'bash /opt/hmd-desktop-release/publish-orchestrate.sh --version \"$VERSION\" --run-id \"$RUN_ID\" --notes-b64 \"$NOTES_B64\" >$LOG 2>&1; echo \$? > $MARK' </dev/null >/dev/null 2>&1 &"
          RC=""
          for i in $(seq 1 55); do
            sleep 60
            RC=$(ssh -o ConnectTimeout=15 jp-ssh.hiredchina.com "cat $MARK 2>/dev/null" 2>/dev/null || true)
            [ -n "$RC" ] && break
            echo "… 等待 jp 发布完成 (${i}/55 min)"
          done
          ssh -o ConnectTimeout=15 jp-ssh.hiredchina.com "tail -60 $LOG" 2>/dev/null || true
          if [ -z "$RC" ]; then echo "✗ 轮询超时(55min),编排可能仍在跑,人工查 $LOG"; exit 1; fi
          [ "$RC" = "0" ] && echo "✅ jp 发布编排全绿" || { echo "✗ jp 发布编排退出码 $RC"; exit "$RC"; }

  finalize:
    name: finalize (status + 播报)
    needs: [detect, build-mac, build-win, handoff]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Resolve final state
        id: state
        env:
          DETECT: ${{ needs.detect.result }}
          MAC: ${{ needs.build-mac.result }}
          WIN: ${{ needs.build-win.result }}
          HANDOFF: ${{ needs.handoff.result }}
        run: |
          ok_or_skip() { [[ "$1" == "success" || "$1" == "skipped" ]]; }
          if [[ "$DETECT" == "failure" || "$HANDOFF" == "failure" ]]; then
            echo "state=failure" >> "$GITHUB_OUTPUT"
          elif [[ "$DETECT" == "success" ]] && ok_or_skip "$MAC" && ok_or_skip "$WIN" && [[ "$HANDOFF" == "success" ]]; then
            echo "state=success" >> "$GITHUB_OUTPUT"
          else
            echo "state=error" >> "$GITHUB_OUTPUT"
          fi
      - name: Report
        env:
          STATE: ${{ steps.state.outputs.state }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          if [ "$STATE" = "success" ]; then
            echo "::notice title=desktop-build::HunterMate Desktop v${VERSION} 构建+交接完成,发布以 jp 播报为准"
          else
            echo "::error title=desktop-build::state=${STATE} version=${VERSION}"
            exit 1
          fi
      # 失败必响(2026-11-09 定案:发布失败躺一天无人知是事故级缺口):
      # 构建/交接失败即推企微,带 run 链接。发布本身的成败播报由 jp 编排负责。
      - name: 企微播报(失败即推)
        if: always() && steps.state.outputs.state != 'success'
        env:
          STATE: ${{ steps.state.outputs.state }}
          VERSION: ${{ needs.detect.outputs.version }}
          RUN_URL: https://github.com/hiredchina-com/hc-action-factory/actions/runs/${{ github.run_id }}
          WEBHOOK: ${{ secrets.WECOM_WEBHOOK_URL }}
        run: |
          MSG="❌ HunterMate Desktop v${VERSION} 构建/交接失败(state=${STATE})\n${RUN_URL}"
          curl -sS --max-time 15 -X POST -H 'Content-Type: application/json' "$WEBHOOK" \
            -d "{\"msgtype\":\"markdown\",\"markdown\":{\"content\":\"$MSG\"}}" || true
