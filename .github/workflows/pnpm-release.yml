name: pipeline/pnpm-release

# pnpm 项目通用 Release(替代各私有仓 release.yml 的重计算部分)
# 由 router.yml 按 event_type=pnpm-release 调用。
#
# params_json schema:
# {
#   "version_file": "packages/cli/package.json",  # 版本 SSOT(相对仓库根)
#   "node": "22",
#   "pnpm_version": "9",
#   "install": "pnpm install --frozen-lockfile",
#   "scripts": ["lint","typecheck","test","build"],
#   "verify": "<bash,可选>",                        # 发布门禁(资产完整性校验等)
#   "publish_mode": "recursive",                   # recursive=pnpm -r publish | packages=按目录逐个
#   "packages": ["packages/kit","packages/cli"],   # packages 模式必填,按依赖拓扑序排列
#   "publish_gates": [{"before_dir":"packages/cli","script":"<bash>"}],  # 可选:发布某包前执行(cwd=该包目录)
#   "npm_access": "public",
#   "release_name": "hunter-mate",                 # GitHub Release 标题前缀
#   "post_dispatches": [                           # publish 成功后触发的下游事件(发回工厂 router)
#     {"event_type":"sync-deps","payload":{"package":"kit","source_repository":"hiredchina-com/chromepilot","version_from":"packages/kit"}}
#   ],
#   "status_context": "factory/pnpm-release",
#   "notify": {"start": true, "finish": "always"}
# }
#
# 设计说明:
# - tag 基准自洽:prev = 目标仓最新 v* tag(与原实现一致)
# - GitHub Release 与 tag 仍创建在【目标私有仓】(gh release create --repo, FACTORY_PAT)
# - 与原实现的语义差异:原 notify job 在全部结束后才发 START + FINISH 两条,本 pipeline 保持该语义
on:
  workflow_call:
    inputs:
      repository:
        type: string
        required: true
      sha:
        type: string
        required: true
      ref_name:
        type: string
        default: ""
      actor:
        type: string
        default: ""
      event_name:
        type: string
        default: ""
      commit_msg:
        type: string
        default: ""
      commit_author:
        type: string
        default: ""
      force:
        type: string
        default: "false"   # "true" = 手动重发,忽略 version 未变化的 skip
      params_json:
        type: string
        default: "{}"

concurrency:
  group: pnpm-release-${{ inputs.repository }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect version change
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      version: ${{ steps.diff.outputs.version }}
      prev_version: ${{ steps.diff.outputs.prev_version }}
    steps:
      - uses: ./.github/actions/checkout-private
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.sha }}
          token: ${{ secrets.FACTORY_PAT }}
          fetch-depth: "0"

      - name: Detect version change vs latest tag
        id: diff
        env:
          PARAMS: ${{ inputs.params_json }}
        run: |
          set -euo pipefail
          VERSION_FILE=$(jq -r '.version_file // "packages/cli/package.json"' <<< "$PARAMS")
          CUR=$(node -p "require('./${VERSION_FILE}').version")
          echo "current version: $CUR"

          # 上一个已发布版本 = 最新 v* tag(tag 由本 pipeline 创建,是自洽基准);无 tag → 首次发布
          PREV=$(git tag --list 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
          echo "prev published version: ${PREV:-<none,first release>}"

          # 纯正则校验 semver:本 step 无 node_modules,不能 require('semver')
          if ! printf '%s' "$CUR" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "✗ version '$CUR' 不是合法 semver,跳过 release"
            echo "changed=0" >> "$GITHUB_OUTPUT"
          elif [ -n "$PREV" ] && [ "$CUR" = "$PREV" ]; then
            echo "version unchanged ($CUR),skip release"
            echo "changed=0" >> "$GITHUB_OUTPUT"
          else
            echo "version changed: ${PREV:-<none>} → $CUR"
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$CUR" >> "$GITHUB_OUTPUT"
          echo "prev_version=$PREV" >> "$GITHUB_OUTPUT"

  publish:
    name: Build & Publish to npm
    needs: detect
    if: needs.detect.outputs.changed == '1' || inputs.force == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/checkout-private
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.sha }}
          token: ${{ secrets.FACTORY_PAT }}
          fetch-depth: "1"

      - name: Setup pnpm (pinned)
        if: ${{ fromJSON(inputs.params_json).pnpm_version != '' }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ fromJSON(inputs.params_json).pnpm_version }}

      - name: Setup pnpm (packageManager field)
        if: ${{ fromJSON(inputs.params_json).pnpm_version == '' }}
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ fromJSON(inputs.params_json).node || '22' }}
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install deps
        env:
          PARAMS: ${{ inputs.params_json }}
        run: |
          set -euo pipefail
          eval "$(jq -r '.install // "pnpm install --frozen-lockfile"' <<< "$PARAMS")"

      - name: Run scripts
        env:
          PARAMS: ${{ inputs.params_json }}
        run: |
          set -euo pipefail
          for s in $(jq -r '.scripts[]?' <<< "$PARAMS"); do
            echo "== pnpm run $s =="
            pnpm run "$s"
          done

      - name: Verify (publish gate)
        if: ${{ fromJSON(inputs.params_json).verify != null }}
        env:
          PARAMS: ${{ inputs.params_json }}
        run: |
          set -euo pipefail
          jq -r '.verify' <<< "$PARAMS" | bash -euo pipefail

      - name: Publish (recursive)
        if: ${{ fromJSON(inputs.params_json).publish_mode != 'packages' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PARAMS: ${{ inputs.params_json }}
        run: |
          set -euo pipefail
          ACCESS=$(jq -r '.npm_access // "public"' <<< "$PARAMS")
          # --no-git-checks: checkout 是 detached HEAD;provenance 不可用(私有仓 npm 422)
          pnpm -r publish --access "$ACCESS" --no-git-checks

      - name: Publish (per-package, skip existing)
        if: ${{ fromJSON(inputs.params_json).publish_mode == 'packages' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PARAMS: ${{ inputs.params_json }}
        run: |
          set -euo pipefail
          ACCESS=$(jq -r '.npm_access // "public"' <<< "$PARAMS")
          ANY=0
          for dir in $(jq -r '.packages[]' <<< "$PARAMS"); do
            NAME=$(node -p "require('./${dir}/package.json').name")
            VER=$(node -p "require('./${dir}/package.json').version")
            if npm view "${NAME}@${VER}" version >/dev/null 2>&1; then
              echo "${NAME}@${VER} 已发布,跳过"
              continue
            fi
            # publish gate:发布该包前执行的自定义 bash(如 fresh-install 冒烟)
            GATE=$(jq -r --arg d "$dir" '.publish_gates // [] | map(select(.before_dir == $d)) | .[0].script // empty' <<< "$PARAMS")
            if [ -n "$GATE" ]; then
              echo "== publish gate for $dir =="
              (cd "$dir" && bash -euo pipefail -c "$GATE")
            fi
            echo "== publishing ${NAME}@${VER} =="
            (cd "$dir" && pnpm publish --access "$ACCESS" --no-git-checks)
            ANY=1
            # 等 npm registry 索引,供下游 dispatch 的消费者立即安装
            for attempt in $(seq 1 12); do
              npm view "${NAME}@${VER}" version >/dev/null 2>&1 && break
              sleep 5
            done
          done
          echo "published=$ANY" >> "$GITHUB_OUTPUT"

      - name: Post dispatches
        if: ${{ fromJSON(inputs.params_json).post_dispatches != null }}
        env:
          GH_TOKEN: ${{ secrets.FACTORY_PAT }}
          PARAMS: ${{ inputs.params_json }}
          FACTORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          COUNT=$(jq '.post_dispatches | length' <<< "$PARAMS")
          for i in $(seq 0 $((COUNT - 1))); do
            ENTRY=$(jq -c ".post_dispatches[$i]" <<< "$PARAMS")
            EVENT_TYPE=$(jq -r '.event_type' <<< "$ENTRY")
            PAYLOAD=$(jq -c '.payload // {}' <<< "$ENTRY")
            VFROM=$(jq -r '.payload.version_from // empty' <<< "$ENTRY")
            if [ -n "$VFROM" ]; then
              VER=$(node -p "require('./${VFROM}/package.json').version")
              PAYLOAD=$(jq -c --arg v "$VER" 'del(.version_from) + {version:$v}' <<< "$PAYLOAD")
            fi
            BODY=$(jq -nc --arg et "$EVENT_TYPE" --argjson cp "$PAYLOAD" '{event_type:$et, client_payload:$cp}')
            echo "== dispatch $EVENT_TYPE -> $FACTORY : $PAYLOAD"
            curl -fsS --max-time 15 -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$FACTORY/dispatches" \
              -d "$BODY" || echo "(dispatch $EVENT_TYPE 失败,需手动补发)" >&2
          done

  release:
    name: Create GitHub Release (target repo)
    needs: [detect, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/checkout-private
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.sha }}
          token: ${{ secrets.FACTORY_PAT }}
          fetch-depth: "0"

      - name: Create tag + Release in target repo
        env:
          GH_TOKEN: ${{ secrets.FACTORY_PAT }}
          REPO: ${{ inputs.repository }}
          SHA: ${{ inputs.sha }}
          VERSION: ${{ needs.detect.outputs.version }}
          PREV: ${{ needs.detect.outputs.prev_version }}
          PARAMS: ${{ inputs.params_json }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG 已存在,跳过创建"
            exit 0
          fi

          RELEASE_NAME=$(jq -r '.release_name // "release"' <<< "$PARAMS")
          PREV_TAG=""
          if [ -n "$PREV" ] && git rev-parse -q --verify "refs/tags/v${PREV}" >/dev/null; then
            PREV_TAG="v${PREV}"
          fi
          RANGE="${PREV_TAG:+$PREV_TAG..}HEAD"

          {
            echo "## ${RELEASE_NAME} ${VERSION}"
            echo
            echo "### Commits"
            echo
            git log --pretty=format:"- %s (%h)" "$RANGE" | head -50
            echo
            echo
            echo "### 说明"
            echo
            echo "- 此版本由 hc-action-factory 的 pnpm-release pipeline 自动发布"
          } > release_notes.md

          # gh release create 会远程建 tag(--target 指定 sha),无需本地 git push
          gh release create "$TAG" \
            --repo "$REPO" \
            --target "$SHA" \
            --title "${RELEASE_NAME} ${VERSION}" \
            --notes-file release_notes.md

  finalize:
    name: finalize (status + notify)
    needs: [detect, publish, release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Resolve final state
        id: state
        env:
          DETECT: ${{ needs.detect.result }}
          PUBLISH: ${{ needs.publish.result }}
          RELEASE: ${{ needs.release.result }}
        run: |
          if [[ "$DETECT" == "failure" || "$PUBLISH" == "failure" || "$RELEASE" == "failure" ]]; then
            echo "state=failure" >> "$GITHUB_OUTPUT"; echo "emoji=[FAIL]" >> "$GITHUB_OUTPUT"
          elif [[ "$DETECT" == "success" && ( "$PUBLISH" == "success" || "$PUBLISH" == "skipped" ) && ( "$RELEASE" == "success" || "$RELEASE" == "skipped" ) ]]; then
            echo "state=success" >> "$GITHUB_OUTPUT"; echo "emoji=[OK]" >> "$GITHUB_OUTPUT"
          elif [[ "$DETECT" == "cancelled" || "$PUBLISH" == "cancelled" || "$RELEASE" == "cancelled" ]]; then
            echo "state=error" >> "$GITHUB_OUTPUT"; echo "emoji=[CANCEL]" >> "$GITHUB_OUTPUT"
          else
            echo "state=error" >> "$GITHUB_OUTPUT"; echo "emoji=[LOG]" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/report-status
        with:
          token: ${{ secrets.FACTORY_PAT }}
          repository: ${{ inputs.repository }}
          sha: ${{ inputs.sha }}
          state: ${{ steps.state.outputs.state }}
          context: ${{ fromJSON(inputs.params_json).status_context || 'factory/pnpm-release' }}
          description: "release v${{ needs.detect.outputs.version }}: detect=${{ needs.detect.result }} publish=${{ needs.publish.result }} release=${{ needs.release.result }}"

      - name: "Notify start (parity: 原实现在结束时补发 START)"
        if: ${{ steps.state.outputs.state != 'error' && fromJSON(inputs.params_json).notify.start != false }}
        uses: ./.github/actions/wecom-notify
        with:
          webhook_url: ${{ secrets.WECOM_WEBHOOK_URL }}
          content: |
            **[START] ${{ inputs.repository }} release ${{ needs.detect.outputs.version }}**

            > **Event**: `${{ inputs.event_name }}` · **Actor**: @${{ inputs.actor }}
            > **Commit**: `${{ inputs.sha }}` — ${{ inputs.commit_msg }}
            > **Author**: @${{ inputs.commit_author }}

            - version: `${{ needs.detect.outputs.version }}`
            - 链接: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Notify finish
        if: ${{ fromJSON(inputs.params_json).notify.finish != 'never' && (fromJSON(inputs.params_json).notify.finish == 'always' || steps.state.outputs.state == 'failure') }}
        uses: ./.github/actions/wecom-notify
        with:
          webhook_url: ${{ secrets.WECOM_WEBHOOK_URL }}
          content: |
            **${{ steps.state.outputs.emoji }} ${{ inputs.repository }} release ${{ needs.detect.outputs.version }}**

            > **Event**: `${{ inputs.event_name }}` · **Actor**: @${{ inputs.actor }}
            > **Commit**: `${{ inputs.sha }}` — ${{ inputs.commit_msg }}
            > **Author**: @${{ inputs.commit_author }}

            - detect: ${{ needs.detect.result }}
            - publish: ${{ needs.publish.result }}
            - release: ${{ needs.release.result }}
            - version: `${{ needs.detect.outputs.version }}`
            - 链接: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
