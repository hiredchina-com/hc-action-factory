name: checkout-private
description: >-
  Checkout a private repository at a given sha/branch using a cross-repo PAT.
  The factory repo is public and runs builds for private repos on free runners;
  all private code enters the runner through this single action so the token
  handling stays in one place.
inputs:
  repository:
    description: "Full name of the target (private) repo, e.g. hiredchina-com/hunter-mate"
    required: true
  ref:
    description: "sha (preferred), branch or tag to checkout"
    required: true
  token:
    description: "PAT with contents:read on the target repo (FACTORY_PAT)"
    required: true
  fetch-depth:
    description: "fetch-depth for checkout (0 = full history, needed by release/tag logic)"
    default: "0"
runs:
  using: composite
  steps:
    # 暂存工厂仓本地 actions:actions/checkout 会 clean 整个 workspace,而 runner 在
    # job 的 post 阶段会重新加载本地 action 元数据,被清掉会报
    # "Can't find action.yml ... Did you forget to run actions/checkout"。
    # 暂存到 RUNNER_TEMP(workspace 之外),检出目标仓后还原。
    # posix 分支用 sh:兼容 alpine 等无 bash 的 container job;windows 分支用 pwsh。
    - name: Guard ref + stash factory actions (posix)
      if: runner.os != 'Windows'
      shell: sh
      env:
        REF: ${{ inputs.ref }}
      run: |
        # 拒绝空格/控制字符,防止 ref 注入 checkout 参数
        if printf '%s' "$REF" | grep -qE '[[:space:]]'; then
          echo "✗ illegal ref: contains whitespace" >&2
          exit 1
        fi
        rm -rf "$RUNNER_TEMP/factory-actions"
        if [ -d .github/actions ]; then
          mkdir -p "$RUNNER_TEMP/factory-actions"
          cp -r .github/actions "$RUNNER_TEMP/factory-actions/"
        fi

    - name: Guard ref + stash factory actions (windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        REF: ${{ inputs.ref }}
      run: |
        if ($env:REF -match '\s') { Write-Error "✗ illegal ref: contains whitespace"; exit 1 }
        $stash = Join-Path $env:RUNNER_TEMP 'factory-actions'
        if (Test-Path $stash) { Remove-Item -Recurse -Force $stash }
        if (Test-Path '.github/actions') {
          New-Item -ItemType Directory -Force -Path $stash | Out-Null
          Copy-Item -Recurse '.github/actions' $stash
        }

    - name: Checkout ${{ inputs.repository }} @ ${{ inputs.ref }}
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        token: ${{ inputs.token }}
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Restore factory actions (posix)
      if: runner.os != 'Windows'
      shell: sh
      run: |
        if [ -d "$RUNNER_TEMP/factory-actions/actions" ]; then
          mkdir -p .github/actions
          cp -r "$RUNNER_TEMP/factory-actions/actions/." .github/actions/
        fi

    - name: Restore factory actions (windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $stash = Join-Path $env:RUNNER_TEMP 'factory-actions/actions'
        if (Test-Path $stash) {
          New-Item -ItemType Directory -Force -Path '.github/actions' | Out-Null
          Copy-Item -Recurse -Force "$stash\*" '.github/actions/'
        }
