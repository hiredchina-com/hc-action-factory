name: report-status
description: >-
  Report a commit status back to the target (private) repository so PRs and
  branch protection keep working even though the run lives in the factory repo.
inputs:
  token:
    description: "PAT with statuses:write on the target repo (FACTORY_PAT)"
    required: true
  repository:
    description: "Full name of the target repo"
    required: true
  sha:
    description: "40-char commit sha to attach the status to"
    required: true
  state:
    description: "pending | success | failure | error"
    required: true
  context:
    description: "Status context, e.g. factory/pnpm-ci"
    required: true
  description:
    description: "Short status description"
    default: ""
  target_url:
    description: "Link shown on the status; defaults to this factory run"
    default: ""
runs:
  using: composite
  steps:
    - name: Post commit status (${{ inputs.state }} · ${{ inputs.context }})
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repository }}
        SHA: ${{ inputs.sha }}
        STATE: ${{ inputs.state }}
        CONTEXT: ${{ inputs.context }}
        DESC: ${{ inputs.description }}
        TARGET_URL: ${{ inputs.target_url }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "✗ illegal sha: $SHA" >&2; exit 1; }
        case "$STATE" in pending|success|failure|error) ;; *) echo "✗ illegal state: $STATE" >&2; exit 1;; esac
        [[ -n "$TARGET_URL" ]] || TARGET_URL="$RUN_URL"
        PAYLOAD=$(jq -nc \
          --arg state "$STATE" --arg ctx "$CONTEXT" --arg url "$TARGET_URL" --arg desc "$DESC" \
          '{state:$state, context:$ctx, target_url:$url, description:($desc|.[0:140])}')
        curl -fsS --max-time 15 -X POST \
          -H "Authorization: token $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/$REPO/statuses/$SHA" \
          -d "$PAYLOAD" > /dev/null
        echo "✓ status $STATE ($CONTEXT) -> $REPO@$SHA"
